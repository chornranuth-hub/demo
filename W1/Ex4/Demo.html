<body>
    <h1>APPLICATION FORM</h1>
    
    <p>Thank you for your interest in working with us, Please check below for avaliable job opportunities that need your criteria and send your application by filling out the Job Application Form.</p>
    
    <label for="Full Name">* Full Name:</label>
    <input type="text" placeholder="Enter Your Full Name">
    <br> <br>

    <label for="Email">* Email:</label>
    <input type="text" placeholder="Enter Your Email">
    <br> <br>

    <label for="Age">* Age:</label>
    <input type="text" placeholder="Age">
    <br> <br>

    <label for="Role">Which option best describe your current role?</label>
    <select name="Role" id="">
        <option value="">Student</option>
        <option value="">Unemployed</option>
    </select>

    <br> <br>
    <label for="ref">* Would you like to list references?</label>
    <br>
    <label for="ref">Yes </label>
    <input type="radio" name="" id="">
    <label for="ref">No </label>
    <input type="radio" name="" id="">

    <label for="Role">Which position would you like to apply for?</label>
    <select name="Role" id="">
        <option value="">Select an option</option>
        <option value="">Sale</option>
    </select>

    <br> <br>
    <label for="ref">Which programming languages do you know?</label>

    <br>
    <label for="ref">Java </label>
    <input type="radio" name="" id="">
    <br>
    <label for="ref">Python </label>
    <input type="radio" name="" id="">
    <br>
    <label for="ref">C++ </label>
    <input type="radio" name="" id="">
    <br>
    <label for="ref">Swift </label>
    <input type="radio" name="" id="">
    <br>
    <label for="ref">Ruby </label>
    <input type="radio" name="" id="">
    <br>
    <label for="ref">.NET </label>
    <input type="radio" name="" id="">

</body>
